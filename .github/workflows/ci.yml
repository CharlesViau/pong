name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust checks
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Keep the core independent
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $core = $metadata.packages | Where-Object name -eq 'pong_core'
          if (@($core.dependencies).Count -ne 0) { throw 'pong_core must remain dependency-free.' }
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Source layout
        shell: pwsh
        run: ./scripts/check-source-layout.ps1
      - name: Architecture boundaries
        shell: pwsh
        run: ./scripts/check-architecture.ps1
      - name: Tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
